
services:
  auth:
    build:
      context: ./Backend/Auth
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/Auth/.env
    restart: unless-stopped

  notification:
    build:
      context: ./Backend/Notification
      dockerfile: dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./Backend/Notification/.env
    restart: unless-stopped

  music:
    build:
      context: ./Backend/Music
      dockerfile: dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./Backend/Music/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    ports:
      - "5173:10000"
    environment:
      VITE_AUTH_API_URL: http://auth:3000
      VITE_MUSIC_API_URL: http://music:3002
    depends_on:
      - auth
      - notification
      - music
    restart: unless-stopped
